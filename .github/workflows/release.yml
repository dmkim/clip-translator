name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        shell: pwsh
        run: >
          ./build/package/build.ps1
          -Version "${{ github.ref_name }}"
          -Output "dist/clip-translator_windows_amd64.exe"

      - name: Generate checksums
        shell: pwsh
        run: |
          $path = "dist/clip-translator_windows_amd64.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLower()
          "$hash  clip-translator_windows_amd64.exe" |
            Out-File -FilePath "dist/checksums.txt" -Encoding ascii

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/clip-translator_windows_amd64.exe
            dist/checksums.txt
          generate_release_notes: true
